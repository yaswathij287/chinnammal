<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chinnammal — Smart Management Platform</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .error-banner {
      display: none;
      padding: 10px 14px;
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: var(--radius-md);
      color: var(--danger);
      font-size: 0.82rem;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .password-wrapper {
      position: relative;
    }
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1rem;
      padding: 4px;
    }
  </style>
  <script>
    // Immediate pre-render check: if no administrator exists, redirect to setup immediately
    (async () => {
      try {
        const res = await fetch('/api/auth/setup-required').then(r => r.json());
        if (res && res.success && res.data && res.data.setupRequired) {
          window.location.replace('/setup.html');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-brand">
      <div class="login-emblem">CH</div>
      <h1>CHINNAMMAL</h1>
      <p>Smart Management Platform</p>
    </div>

    <div style="text-align: center; margin-bottom: 24px;">
      <h2 style="font-size: 1.15rem; font-weight: 700; color: var(--text-main);">Welcome to Chinnammal</h2>
      <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 4px;">Sign in to access your administrative, warden, or student workspace</p>
    </div>

    <div id="loginError" class="error-banner"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your username" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
          <button type="button" id="togglePassword" class="toggle-password" title="Show password">👁️</button>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 0.95rem;">
        Sign In
      </button>
    </form>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
